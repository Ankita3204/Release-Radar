# Local development only. Everything binds to 127.0.0.1; credentials come from your shell/.env, not this file.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: releaseradar
      POSTGRES_USER: releaseradar_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
volumes:
  pgdata:
