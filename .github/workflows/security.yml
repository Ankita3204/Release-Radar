name: security
on:
  push: {branches: [main]}
  pull_request:
  schedule: [{cron: "17 3 * * 1"}]
permissions:
  contents: read
jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions: {contents: read, security-events: write}
    strategy: {matrix: {language: [python, javascript-typescript]}}
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: {languages: "${{ matrix.language }}"}
      - uses: github/codeql-action/analyze@v3
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pip-audit && pip-audit -r apps/api/requirements.lock.txt
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - run: npm audit --omit=dev --audit-level=high
        working-directory: apps/web
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t releaseradar-api apps/api && docker build -t releaseradar-web apps/web
      - uses: aquasecurity/trivy-action@master
        with: {image-ref: releaseradar-api, severity: "HIGH,CRITICAL", exit-code: "1"}
